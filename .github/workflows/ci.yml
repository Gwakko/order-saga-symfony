name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
      # Dev server for the consumer integration test (T-I-20). Port 7233 stays free for temporal-test-server (make test-wf).
      TEMPORAL_ADDRESS: 127.0.0.1:7234
      # Gateway emulator runs on the runner (in compose it is a separate service).
      PAYMENT_GATEWAY_URL: http://127.0.0.1:8081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_pgsql, redis, sockets, zip, opcache, grpc, protobuf
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start Temporal dev server (T-I-20)
        run: |
          docker run -d --name temporal-dev -p 7234:7233 temporalio/temporal:1.10.1 server start-dev --ip 0.0.0.0
          for i in $(seq 30); do (echo > /dev/tcp/127.0.0.1/7234) 2>/dev/null && break; sleep 1; done

      - name: Install RoadRunner and temporal-test-server (workflow tests, make test-wf)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./vendor/bin/rr get-binary --location /usr/local/bin || (./vendor/bin/rr get-binary && sudo mv rr /usr/local/bin/rr)
          php bin/install-temporal-test-server.php

      - name: Start gateway emulator
        run: |
          cd gateway-emulator
          PHP_CLI_SERVER_WORKERS=8 nohup php -S 127.0.0.1:8081 -t public > /tmp/gateway-emulator.log 2>&1 &
          for i in $(seq 30); do (echo > /dev/tcp/127.0.0.1/8081) 2>/dev/null && break; sleep 1; done

      - name: Run checks
        run: make ci PHP=
