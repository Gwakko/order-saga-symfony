# Background workers share the php image. They are in the `workers` profile: `docker compose --profile workers up -d`.
# They are not started by a plain `up`, because the integration tests share the database and the Redis streams and a
# running relay would publish the rows those tests expect to find unpublished.
x-worker: &worker
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /app
  volumes:
    - .:/app
  environment:
    APP_ENV: dev
  restart: unless-stopped
  profiles: ["workers"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app:ro
    depends_on:
      - php

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

  gateway-emulator:
    image: php:8.5-cli-alpine
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8081", "-t", "public"]
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
    volumes:
      - ./gateway-emulator:/app
    ports:
      - "8081:8081"

  # Outbox -> Redis Stream (at least once; several copies may run, rows are locked per batch).
  outbox-relay:
    <<: *worker
    command: ["php", "bin/console", "app:outbox:relay", "--sleep=200", "-v"]

  # Stream consumers: projections (order_view, product_availability_view). Retries, then the `failed` transport.
  messenger-consumer:
    <<: *worker
    command: ["php", "bin/console", "messenger:consume", "domain_events", "--time-limit=3600", "--memory-limit=256M", "-v"]

  # Symfony Scheduler: ExpireReservations every 30 s, ReconcilePayments every 5 min.
  scheduler:
    <<: *worker
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "--memory-limit=256M", "-v"]

  # Temporal worker: RoadRunner (`rr serve`) holds the gRPC connection and starts `bin/temporal-worker.php` (Symfony Kernel).
  # Not in the `workers` profile: the hello spike needs it with a plain `docker compose up -d temporal temporal-worker`.
  temporal-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      TEMPORAL_ADDRESS: temporal:7233
    command: ["rr", "serve", "-c", ".rr.yaml"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started

  # Go worker (M9): InspectGatewayCharge on its own task queue. Profile `go`, not `workers`:
  # `docker compose --profile go up -d worker-go`. A plain `up` and `make smoke` do not build or start it.
  # The queue name comes from the environment (test isolation, M8a): GO_WORKER_TASK_QUEUE=payment-go-test-<hex> docker compose ...
  worker-go:
    build:
      context: ./worker-go
    profiles: ["go"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      GO_WORKER_TASK_QUEUE: ${GO_WORKER_TASK_QUEUE:-payment-go}
      GATEWAY_BASE_URL: http://gateway-emulator:8081
      LOG_FORMAT: json
    depends_on:
      temporal:
        condition: service_started
      gateway-emulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # Go toolchain for worker-go tests (M9). Not started by `up`: `docker compose run --rm go-toolchain ...` (make go-test).
  # The whole repository is mounted at /src because the Go tests read the golden files from /src/contracts.
  go-toolchain:
    image: golang:1.27.3-bookworm
    profiles: ["tools"]
    working_dir: /src/worker-go
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      TEMPORAL_ADDRESS: temporal:7233

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
