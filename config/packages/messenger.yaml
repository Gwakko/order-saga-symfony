framework:
    messenger:
        # A message that failed 5 retries ends up on the `failed` transport (EC-57); inspect with `messenger:failed:show`.
        failure_transport: failed

        # Messages travel as JSON (Symfony Serializer), not as PHP serialize(): the stream stays readable and survives
        # deployments that change classes. The body is the OutboxMessage (event id, aggregate, version, payload).
        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: {}

        transports:
            # Domain events published by the outbox relay (Redis Streams). Delivery is at least once: consumers deduplicate
            # through the inbox (InboxGuard).
            domain_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: domain_events
                    group: app
                    auto_setup: true
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: domain_events_failed
                    group: app
                    auto_setup: true

        routing:
            App\Shared\Infrastructure\Outbox\OutboxMessage: domain_events

when@test:
    framework:
        messenger:
            transports:
                domain_events:
                    dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                    options:
                        stream: domain_events_test
                        group: app
                        auto_setup: true
                    retry_strategy:
                        max_retries: 5
                        delay: 1
                        multiplier: 1
                        max_delay: 1
                failed:
                    dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                    options:
                        stream: domain_events_failed_test
                        group: app
                        auto_setup: true
