services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # Test-only Messenger consumers (T-I-36) live next to the tests, not in src/.
    App\Tests\Integration\Support\Messenger\:
        resource: '../tests/Integration/Support/Messenger/'

    # Infrastructure under test is fetched from the container by class name.
    App\Shared\Infrastructure\Persistence\DbalTransactionManager: ~
    App\Shared\Infrastructure\Outbox\OutboxWriter: ~
    App\Shared\Infrastructure\Outbox\OutboxRelay: ~
    App\Shared\Infrastructure\Inbox\InboxGuard: ~
    App\Ordering\Infrastructure\Persistence\DbalOrderRepository: ~
    App\Inventory\Infrastructure\Persistence\DbalKeyInventory: ~
    App\Inventory\Infrastructure\Persistence\DbalReservationRepository: ~
    App\Payment\Infrastructure\Persistence\DbalPaymentRepository: ~
    Doctrine\DBAL\Connection: '@doctrine.dbal.default_connection'
    App\Shared\Infrastructure\Outbox\DomainEventCodec: ~
    App\Ordering\Infrastructure\Projection\OrderProjection: ~
    App\Ordering\Infrastructure\Persistence\DbalOrderReadModel: ~
    App\Inventory\Infrastructure\Projection\ProductAvailabilityProjection: ~
    App\Inventory\Infrastructure\Persistence\DbalProductReadModel: ~
    App\Inventory\Infrastructure\Schedule\ExpireReservationsTickHandler: ~
    App\Payment\Infrastructure\Schedule\ReconcilePaymentsTickHandler: ~

    # Functional tests (tests/Functional) reach the HTTP stack through the kernel; this port is replaced to simulate failures (EC-07).
    App\Inventory\Infrastructure\Persistence\DbalProductCatalog: ~
    App\Tests\Functional\Support\SwitchableProductCatalog: ~
    App\Ordering\Application\Port\ProductCatalog: '@App\Tests\Functional\Support\SwitchableProductCatalog'
    App\Shared\Infrastructure\Idempotency\IdempotencyStore:
        alias: App\Shared\Infrastructure\Idempotency\DbalIdempotencyStore
        public: true
    App\Shared\Infrastructure\Idempotency\DbalIdempotencyStore: ~

    # SQL counting for the N+1 test (T-F-32): the stock DBAL logging middleware reports into a recorder.
    App\Tests\Functional\Support\SqlRecorder: ~
    app.test.sql_logging_middleware:
        class: Doctrine\DBAL\Logging\Middleware
        arguments: ['@App\Tests\Functional\Support\SqlRecorder']
        tags: [doctrine.middleware]
