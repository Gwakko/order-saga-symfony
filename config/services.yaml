# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    inventory.reservation_ttl_seconds: 900
    payment.charge_guard_seconds: 60

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'

    # Use case handlers join the synchronous buses by marker interface; the message type comes from `__invoke`.
    _instanceof:
        App\Shared\Application\Bus\CommandHandler:
            tags:
                - { name: messenger.message_handler, bus: command.bus }
        App\Shared\Application\Bus\QueryHandler:
            tags:
                - { name: messenger.message_handler, bus: query.bus }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Inventory\Application\Command\ReserveKey\ReserveKeyHandler:
        arguments:
            $ttlSeconds: '%inventory.reservation_ttl_seconds%'

    App\Payment\Application\Command\ChargePayment\ChargePaymentHandler:
        arguments:
            $chargeGuardSeconds: '%payment.charge_guard_seconds%'

    # Time is UTC and goes through the PSR-20 port only (INV-12, T-ARCH-08).
    Psr\Clock\ClockInterface:
        class: Symfony\Component\Clock\NativeClock
        arguments: ['UTC']

    App\Shared\Infrastructure\Outbox\OutboxPublisher: '@App\Shared\Infrastructure\Outbox\MessengerOutboxPublisher'

    # Payment gateway: HTTP adapter wrapped by the circuit breaker; breaker state shared through Redis (EC-31..EC-35).
    App\Payment\Infrastructure\Gateway\HttpPaymentGateway:
        arguments:
            $baseUri: '%env(PAYMENT_GATEWAY_URL)%'

    App\Shared\Infrastructure\Redis\RedisConnection:
        arguments:
            $url: '%env(REDIS_URL)%'

    App\Payment\Infrastructure\Gateway\CircuitStateStore: '@App\Payment\Infrastructure\Gateway\RedisCircuitStateStore'

    App\Payment\Infrastructure\Gateway\CircuitBreaker:
        arguments:
            $name: 'payment-gateway'

    App\Payment\Infrastructure\Gateway\CircuitBreakingPaymentGateway:
        arguments:
            $inner: '@App\Payment\Infrastructure\Gateway\HttpPaymentGateway'

    App\Payment\Application\Port\PaymentGateway: '@App\Payment\Infrastructure\Gateway\CircuitBreakingPaymentGateway'

    # Temporal (M6.1). The client needs ext-grpc; the worker (bin/temporal-worker.php) fetches activities from the container.
    App\Saga\Infrastructure\Temporal\TemporalClientFactory:
        arguments:
            $address: '%env(TEMPORAL_ADDRESS)%'
            $callTimeoutSeconds: '%temporal.client.call_timeout_seconds%'
            $maxAttempts: '%temporal.client.max_attempts%'

    App\Saga\Infrastructure\Temporal\Hello\HelloActivityImpl:
        public: true

    # Temporal saga (M6.2): validated timeout table, client, starter. The worker hands the configuration to the workflow
    # through SagaConfigurationHolder (bin/temporal-worker.php).
    App\Saga\Infrastructure\Temporal\Config\SagaConfiguration:
        public: true
        factory: ['App\Saga\Infrastructure\Temporal\Config\SagaConfiguration', 'fromParameters']
        arguments:
            $taskQueue: '%temporal.task_queue%'
            $workflowExecutionTimeoutSeconds: '%temporal.order_workflow.execution_timeout_seconds%'
            $activities: '%temporal.activities%'
            $reservationTtlSeconds: '%inventory.reservation_ttl_seconds%'
            $chargeGuardSeconds: '%payment.charge_guard_seconds%'
            $refundWorkflowExecutionTimeoutSeconds: '%temporal.refund_workflow.execution_timeout_seconds%'

    App\Ordering\Application\Port\OrderSagaStarter: '@App\Saga\Infrastructure\Temporal\TemporalOrderSagaStarter'
    App\Ordering\Application\Port\OrderRefundStarter: '@App\Saga\Infrastructure\Temporal\TemporalOrderRefundStarter'
    App\Ordering\Application\Port\OrderSagaSignals: '@App\Saga\Infrastructure\Temporal\TemporalOrderSagaSignals'

    # Activities are fetched from the container by the worker.
    App\Saga\Infrastructure\Temporal\Activity\InventoryActivitiesImpl:
        public: true
    App\Saga\Infrastructure\Temporal\Activity\PaymentActivitiesImpl:
        public: true
    App\Saga\Infrastructure\Temporal\Activity\OrderActivitiesImpl:
        public: true

    # Worker resilience (M6.4): connection check before an activity, state reset after it (bin/temporal-worker.php).
    App\Saga\Infrastructure\Temporal\Worker\ActivityResilienceInterceptor:
        public: true
    App\Saga\Infrastructure\Temporal\Worker\ActivityLifecycle:
        public: true
        arguments:
            $resetter: '@services_resetter'
    App\Saga\Infrastructure\Temporal\Worker\WorkerConnectionGuard:
        public: true
